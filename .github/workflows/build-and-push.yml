name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-beta:
    name: Build Beta
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push beta image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/snights26/starrynightsindia.in:beta-${{ github.sha }}
            ghcr.io/snights26/starrynightsindia.in:beta-latest
          build-args: |
            VITE_API_BASE_URL=${{ vars.BETA_VITE_API_BASE_URL }}
            VITE_GOOGLE_AUTH_ENABLED=${{ vars.BETA_VITE_GOOGLE_AUTH_ENABLED }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.BETA_VITE_GOOGLE_CLIENT_ID }}
            VITE_PUBLIC_BROWSER_CACHE_ENABLED=${{ vars.BETA_VITE_PUBLIC_BROWSER_CACHE_ENABLED }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-production:
    name: Build Production
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/snights26/starrynightsindia.in:prod-${{ github.sha }}
            ghcr.io/snights26/starrynightsindia.in:prod-latest
            ghcr.io/snights26/starrynightsindia.in:latest
          build-args: |
            VITE_API_BASE_URL=${{ vars.PROD_VITE_API_BASE_URL }}
            VITE_GOOGLE_AUTH_ENABLED=${{ vars.PROD_VITE_GOOGLE_AUTH_ENABLED }}
            VITE_GOOGLE_CLIENT_ID=${{ vars.PROD_VITE_GOOGLE_CLIENT_ID }}
            VITE_PUBLIC_BROWSER_CACHE_ENABLED=${{ vars.PROD_VITE_PUBLIC_BROWSER_CACHE_ENABLED }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Production
    needs: [build-production]
    runs-on: ubuntu-latest
    env:
      # Set this repository variable to the reachable Portainer URL. The
      # fallback keeps the existing deployment target during the transition.
      PORTAINER_BASE_URL: ${{ vars.PORTAINER_BASE_URL || 'https://portainer.buildstack.dpdns.org' }}

    steps:
      - name: Verify Portainer connectivity and credentials
        run: |
          PORTAINER_BASE_URL="${PORTAINER_BASE_URL%/}"

          # curl exit code 6 is a DNS failure. Capture it instead of letting
          # bash -e terminate with a misleading authentication message.
          set +e
          HTTP_CODE=$(curl --silent --show-error -o /dev/null -w "%{http_code}" \
            --connect-timeout 10 --max-time 30 \
            "$PORTAINER_BASE_URL/api/users/me" \
            -H 'X-API-Key: ${{ secrets.PORTAINER_API_KEY }}')
          CURL_EXIT=$?
          set -e

          if [ "$CURL_EXIT" -ne 0 ]; then
            if [ "$CURL_EXIT" -eq 6 ]; then
              echo "Portainer DNS lookup failed for $PORTAINER_BASE_URL. Update the DNS record or set the PORTAINER_BASE_URL repository variable to the reachable Portainer URL."
            else
              echo "Could not reach Portainer (curl exit code $CURL_EXIT) at $PORTAINER_BASE_URL."
            fi
            exit "$CURL_EXIT"
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Portainer authentication failed (HTTP $HTTP_CODE). Check PORTAINER_API_KEY secret."
            exit 1
          fi

          echo "Portainer authentication verified."

      - name: Force update production service
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X PUT \
            "${PORTAINER_BASE_URL%/}/api/endpoints/6/forceupdateservice" \
            -H 'X-API-Key: ${{ secrets.PORTAINER_API_KEY }}' \
            -H 'Content-Type: application/json' \
            -d '{"serviceID":"${{ secrets.PORTAINER_SERVICE_ID }}","pullImage":true}')

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Response body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Service update failed (HTTP $HTTP_CODE)."
            exit 1
          fi

          echo "Service updated successfully."

      - name: Ensure service replica count is 1
        run: |
          SERVICE=$(curl -s \
            "${PORTAINER_BASE_URL%/}/api/endpoints/6/docker/v1.41/services/${{ secrets.PORTAINER_SERVICE_ID }}" \
            -H 'X-API-Key: ${{ secrets.PORTAINER_API_KEY }}')

          VERSION=$(echo "$SERVICE" | jq '.Version.Index')
          SPEC=$(echo "$SERVICE" | jq '.Spec | .Mode.Replicated.Replicas = 1')

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Failed to fetch service version. Cannot scale."
            exit 1
          fi

          echo "Current version index: $VERSION. Setting replicas to 1."

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${PORTAINER_BASE_URL%/}/api/endpoints/6/docker/v1.41/services/${{ secrets.PORTAINER_SERVICE_ID }}/update?version=$VERSION" \
            -H 'X-API-Key: ${{ secrets.PORTAINER_API_KEY }}' \
            -H 'Content-Type: application/json' \
            -d "$SPEC")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n -1)

          echo "Response body: $BODY"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Scale to 1 replica failed (HTTP $HTTP_CODE)."
            exit 1
          fi

          echo "Service scaled to 1 replica successfully."
